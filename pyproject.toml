[project]
name = "tdl-audio"
version = "0.1.0"
description = "Hackatón AIBiomed (Blue Route) - análisis de audio para cribado de TDL"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "numpy",
    "pandas",
    "librosa",
    "soundfile",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "jupyter",
    "allosaurus>=1.0.2",
    "transformers>=5.9.0",
    "speechbrain>=1.1.0",
]

# --- PyTorch con CUDA 12.4 (compatible con driver 572.16 / CUDA 12.8) ---
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
